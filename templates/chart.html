<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ symbol }} — Chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    :root {
      --bg:      #ffffff;
      --surface: #f5f5f5;
      --border:  #d0d0d0;
      --accent:  #000000;
      --green:   #000000;
      --red:     #000000;
      --text:    #111111;
      --muted:   #888888;
      --gold:    #555555;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .symbol-badge { display:flex; align-items:center; gap:12px; }
    .symbol-dot {
      width:10px; height:10px; border-radius:50%;
      background:var(--accent); box-shadow:0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .symbol-name { font-size:1.4rem; font-weight:800; letter-spacing:0.08em; color:#fff; }
    .symbol-sub  { font-family:'Space Mono',monospace; font-size:0.72rem; color:var(--muted); letter-spacing:0.12em; }
    #live-price  { font-family:'Space Mono',monospace; font-size:1.6rem; font-weight:700; color:var(--accent); }
    #live-change { font-family:'Space Mono',monospace; font-size:0.85rem; padding:4px 10px; border-radius:4px; font-weight:700; }
    .positive { background:rgba(0,230,118,0.12); color:var(--green); }
    .negative { background:rgba(255,23,68,0.12);  color:var(--red);  }

    /* STATS BAR */
    .stats-bar {
      display:flex; gap:32px; padding:12px 32px;
      background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto;
    }
    .stat { display:flex; flex-direction:column; gap:2px; min-width:80px; }
    .stat-label { font-family:'Space Mono',monospace; font-size:0.6rem; color:var(--muted); letter-spacing:0.15em; text-transform:uppercase; }
    .stat-value { font-family:'Space Mono',monospace; font-size:0.9rem; color:var(--text); font-weight:700; }

    /* MAIN */
    main { flex:1; padding:24px 32px; display:flex; flex-direction:column; gap:16px; }
    .chart-header { display:flex; align-items:center; justify-content:space-between; }
    .chart-title  { font-size:0.75rem; letter-spacing:0.2em; color:var(--muted); text-transform:uppercase; }
    .timeframe-btns { display:flex; gap:6px; }
    .tf-btn {
      font-family:'Space Mono',monospace; font-size:0.72rem;
      padding:4px 10px; border-radius:4px; border:1px solid var(--border);
      background:transparent; color:var(--muted); cursor:pointer; transition:all 0.2s;
    }
    .tf-btn.active, .tf-btn:hover { border-color:#000; color:#000; background:rgba(0,0,0,0.05); }

    #chart-wrapper {
      position:relative; width:100%; border-radius:8px; overflow:hidden;
      border:1px solid var(--border); background:#fff;
    }
    #chart { width:100%; height:520px; }

    /* TOOLTIP */
    #tooltip {
      position:absolute; top:14px; left:14px;
      background:rgba(255,255,255,0.95); border:1px solid var(--border);
      border-radius:6px; padding:10px 14px;
      font-family:'Space Mono',monospace; font-size:0.72rem;
      pointer-events:none; display:none; z-index:5; line-height:1.8;
    }
    #tooltip .tt-date { color:var(--muted); margin-bottom:4px; }
    #tooltip .tt-o    { color:#333; }
    #tooltip .tt-h    { color:#000; }
    #tooltip .tt-l    { color:#000; }
    #tooltip .tt-c    { color:#000; font-weight:700; }

    /* LOADING */
    #loading {
      position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      background:#fff; z-index:20; gap:16px;
    }
    .spinner {
      width:36px; height:36px;
      border:3px solid #ddd; border-top-color:#000;
      border-radius:50%; animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .loading-text { font-family:'Space Mono',monospace; font-size:0.72rem; color:var(--muted); letter-spacing:0.1em; }

    /* FOOTER */
    footer {
      padding:12px 32px; border-top:1px solid var(--border);
      font-family:'Space Mono',monospace; font-size:0.65rem; color:var(--muted);
      display:flex; justify-content:space-between;
    }
  </style>
</head>
<body>

  <!-- MAIN -->
  <main>
    <div class="chart-header">
      <span class="chart-title">Velas Diarias · Últimos 180 días</span>
      <div class="timeframe-btns">
        <button class="tf-btn" onclick="filterCandles(30, event)">30D</button>
        <button class="tf-btn" onclick="filterCandles(60, event)">60D</button>
        <button class="tf-btn active" onclick="filterCandles(0, event)">180D</button>
      </div>
    </div>

    <div id="chart-wrapper">
      <div id="loading">
        <div class="spinner"></div>
        <span class="loading-text">Loading</span>
      </div>
      <div id="chart"></div>
      <div id="tooltip"></div>
    </div>
  </main>

  <footer>
    <span id="last-update">—</span>
  </footer>

<script>
  const SYMBOL = "{{ symbol }}";
  let allCandles = [];
  let chart, candleSeries;

  // ── Dibujar líneas desde URL params ──────────────────────────────────────
  function addPriceLines() {
    const p = new URLSearchParams(window.location.search);
    function addLine(val, color, title) {
      const price = parseFloat(val);
      if (!price || price === 0) return;
      candleSeries.createPriceLine({
        price, color, lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed,
        axisLabelVisible: true, title,
      });
    }
    addLine(p.get('entry'), '#000000', 'Entry');
    addLine(p.get('tp1'),   '#16a34a', 'TP1');
    addLine(p.get('tp2'),   '#16a34a', 'TP2');
    addLine(p.get('ts'),    '#4ade80', 'TS');
    addLine(p.get('sl'),    '#ef4444', 'SL');
  }

  // ── Inicializar gráfico ───────────────────────────────────────────────────
  function initChart() {
    chart = LightweightCharts.createChart(document.getElementById("chart"), {
      layout: {
        background: { color: "#ffffff" },
        textColor: "#888888",
        fontFamily: "'Space Mono', monospace",
      },
      grid: {
        vertLines: { color: "#e8e8e8" },
        horzLines: { color: "#e8e8e8" },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
        vertLine: { color: "#00000044", width: 1, style: 2 },
        horzLine: { color: "#00000044", width: 1, style: 2 },
      },
      rightPriceScale: { borderColor: "#d0d0d0" },
      timeScale: { borderColor: "#d0d0d0", timeVisible: true, secondsVisible: false },
      handleScroll: true,
      handleScale: true,
    });

    candleSeries = chart.addCandlestickSeries({
      upColor:         "#ffffff",
      downColor:       "#000000",
      borderUpColor:   "#000000",
      borderDownColor: "#000000",
      wickUpColor:     "#000000",
      wickDownColor:   "#000000",
    });

    // Tooltip
    chart.subscribeCrosshairMove((param) => {
      const tooltip = document.getElementById("tooltip");
      if (!param.time || !param.seriesData.size) { tooltip.style.display = "none"; return; }
      const candle = param.seriesData.get(candleSeries);
      if (!candle) return;
      const date = new Date(param.time * 1000).toLocaleDateString("es-ES", { day:"2-digit", month:"short", year:"numeric" });
      tooltip.innerHTML = `
        <div class="tt-date">${date}</div>
        <div class="tt-o">O  ${candle.open.toFixed(4)}</div>
        <div class="tt-h">H  ${candle.high.toFixed(4)}</div>
        <div class="tt-l">L  ${candle.low.toFixed(4)}</div>
        <div class="tt-c">C  ${candle.close.toFixed(4)}</div>
      `;
      tooltip.style.display = "block";
    });

    // Responsive
    new ResizeObserver(() => {
      chart.applyOptions({ width: document.getElementById("chart").clientWidth });
    }).observe(document.getElementById("chart"));
  }

  // ── Cargar velas ─────────────────────────────────────────────────────────
  async function loadCandles() {
    try {
      const res  = await fetch(`/api/chart/${SYMBOL}`);
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      allCandles = data.candles;
      renderCandles(allCandles);
      addPriceLines();

      document.getElementById("last-update").textContent = "Actualizado: " + new Date().toLocaleTimeString("es-ES");
      document.getElementById("loading").style.display   = "none";

    } catch (e) {
      document.querySelector(".loading-text").textContent = "Error: " + e.message;
    }
  }

  function renderCandles(candles) {
    candleSeries.setData(candles.map(c => ({ time:c.time, open:c.open, high:c.high, low:c.low, close:c.close })));
    chart.timeScale().fitContent();
  }

  function filterCandles(days, e) {
    document.querySelectorAll(".tf-btn").forEach(b => b.classList.remove("active"));
    e.target.classList.add("active");
    renderCandles(days === 0 ? allCandles : allCandles.slice(-days));
  }

  // ── Refresh última vela cada 30s ─────────────────────────────────────────
  async function refreshLastCandle() {
    try {
      const res  = await fetch(`/api/chart/${SYMBOL}`);
      const data = await res.json();
      if (data.error) return;
      allCandles = data.candles;
      const last = data.candles[data.candles.length - 1];
      candleSeries.update({ time:last.time, open:last.open, high:last.high, low:last.low, close:last.close });
      document.getElementById("last-update").textContent = "Actualizado: " + new Date().toLocaleTimeString("es-ES");
    } catch (e) {
      console.error("Error refrescando vela:", e);
    }
  }

  // ── Init ──────────────────────────────────────────────────────────────────
  initChart();
  loadCandles();
  setInterval(refreshLastCandle, 30_000);
</script>
</body>
</html>
